[project]
name = "kpis"
version = "1.0.0"
description = "Resúmenes ejecutivos de KPIs (Banco Mundial, América Latina) redactados por un LLM local con verificación automática de cada cifra"
authors = [{ name = "Erick Guarnizo" }]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
filterwarnings = ["ignore::Warning"]
