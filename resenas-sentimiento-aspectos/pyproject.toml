[project]
name = "resenas"
version = "1.0.0"
description = "Sentimiento por aspecto en reseñas de Amazon: reglas + TF-IDF vs embeddings bge-m3 vs LLM local (qwen2.5:7b), evaluado con etiquetas hechas a mano"
authors = [{ name = "Erick Guarnizo" }]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::Warning"]
