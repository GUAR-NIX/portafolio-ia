[project]
name = "agente"
version = "2.0.0"
description = "Agente con herramientas (tool-calling nativo, qwen2.5:7b) sobre las APIs del Banco Mundial y Open-Meteo, evaluado en validación y prueba separadas"
authors = [{ name = "Erick Guarnizo" }]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
filterwarnings = ["ignore::Warning"]
